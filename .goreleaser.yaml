version: 2

project_name: driga

before:
  hooks:
    # Run once on the host, before parallel cross-builds (no cgo or Windows SDK).
    - go run ./scripts/windows-resources -version {{ .Version }}

release:
  prerelease: true
  make_latest: false

builds:
  - id: driga
    main: ./cmd/driga
    binary: '{{ if eq .Os "darwin" }}Driga.app/Contents/MacOS/{{ end }}driga'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .FullCommit }}
        -X main.date={{ .CommitDate }}

    hooks:
      post:
        - cmd: 'bash scripts/build-macos-app.sh "{{ .Path }}" "{{ .Os }}" "{{ .Version }}" "{{ .IsSnapshot }}"'
          output: true

archives:
  - id: driga
    ids:
      - driga
    name_template: "driga_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - none
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - NOTICE
      - src: internal/web/static/vendor/LICENSES.txt
        dst: third-party/vendor-LICENSES.txt
      - src: internal/web/static/fonts/LICENSE.txt
        dst: third-party/fonts-LICENSE.txt

  - id: driga-macos
    ids:
      - driga
    name_template: "driga_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: windows
        formats: [none]
    # Preserve the binary's bundle path. The hook stages all other app files
    # separately so the archive includes the executable exactly once.
    strip_binary_directory: false
    files:
      - src: '{{ dir (dir (dir (dir .ArtifactPath))) }}/bundle-resources'
        dst: Driga.app
      - README.md
      - LICENSE
      - NOTICE
      - src: internal/web/static/vendor/LICENSES.txt
        dst: third-party/vendor-LICENSES.txt
      - src: internal/web/static/fonts/LICENSE.txt
        dst: third-party/fonts-LICENSE.txt

nfpms:
  - id: driga
    ids:
      - driga
    package_name: driga
    file_name_template: "driga_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: LabStack
    homepage: https://github.com/labstack/driga
    maintainer: LabStack <support@labstack.com>
    description: "Watch every AI coding agent session on a machine: state, project, branch, memory, an attention inbox, and file conflicts."
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - deb
      - rpm

checksum:
  name_template: "driga_{{ .Version }}_checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: driga
    skip_upload: false
    ids:
      - driga-macos
    binaries:
      - '#{caskroom_path}/Driga.app/Contents/MacOS/driga'
    # The OSS custom Ruby block uses Homebrew's normal app artifact with an
    # explicit stable Caskroom destination, avoiding /Applications and the
    # Pro-only GoReleaser `app` (DMG) integration.
    custom_block: |
      app "Driga.app", target: "#{caskroom_path}/Driga.app"
    caveats: |
      Driga.app stays in the Homebrew Caskroom; driga links to its CLI executable.
      If upgrading from a bare-binary release, run driga service install once
      to repair the collector's bundle path and background-item association.
      The bundle path stays stable across later brew upgrades. Restart a running
      collector with driga service restart to use the upgraded executable.
    url:
      template: "https://github.com/labstack/driga/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "chore: update driga to {{ .Tag }}"
    directory: Casks
    homepage: https://github.com/labstack/driga
    description: "Watch every AI coding agent session on a machine: state, project, branch, memory, an attention inbox, and file conflicts."
    repository:
      owner: labstack
      name: homebrew-tap
      branch: main
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    commit_author:
      name: driga-release
      email: support@labstack.com

scoops:
  - name: driga
    skip_upload: false
    ids:
      - driga
    url_template: "https://github.com/labstack/driga/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "chore: update driga to {{ .Tag }}"
    homepage: https://github.com/labstack/driga
    description: "Watch every AI coding agent session on a machine: state, project, branch, memory, an attention inbox, and file conflicts."
    license: Apache-2.0
    repository:
      owner: labstack
      name: scoop-bucket
      branch: main
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    commit_author:
      name: driga-release
      email: support@labstack.com

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
