version: 2

project_name: driga

before:
  hooks:
    # Run once on the host, before parallel cross-builds (no cgo or Windows SDK).
    - go run ./scripts/windows-resources -version {{ .Version }}

release:
  prerelease: true
  make_latest: false

builds:
  - id: driga
    main: ./cmd/driga
    # macOS: the one binary is the bundle's executable (the app and the CLI).
    # Windows: the CLI is bin/driga.exe beside the Driga.exe GUI.
    binary: '{{ if eq .Os "darwin" }}Driga.app/Contents/MacOS/{{ end }}{{ if eq .Os "windows" }}bin/{{ end }}driga'
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .FullCommit }}
        -X main.date={{ .CommitDate }}

    hooks:
      post:
        - cmd: 'bash scripts/build-macos-app.sh "{{ .Path }}" "{{ .Os }}" "{{ .Version }}" "{{ .IsSnapshot }}"'
          output: true

  # Driga.exe, the Windows desktop app: a GUI-subsystem binary that supervises
  # the CLI next to it. Other platforms have a single binary.
  - id: driga-app
    main: ./cmd/driga-app
    binary: Driga
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w -H=windowsgui
        -X main.version={{ .Version }}
        -X main.commit={{ .FullCommit }}
        -X main.date={{ .CommitDate }}

archives:
  - id: driga
    ids:
      - driga
    name_template: "driga_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: darwin
        formats:
          - none
      - goos: windows
        formats:
          - none
    files:
      - README.md
      - LICENSE
      - NOTICE
      - src: internal/web/static/vendor/LICENSES.txt
        dst: third-party/vendor-LICENSES.txt
      - src: internal/web/static/fonts/LICENSE.txt
        dst: third-party/fonts-LICENSE.txt

  # Driga.exe is a plain file here, not an archive binary, so Scoop shims only
  # the CLI (bin/driga.exe): a shim named Driga.exe would collide with driga.exe
  # on case-insensitive Windows and make `driga` open the app.
  - id: driga-windows
    ids:
      - driga
    name_template: "driga_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - zip
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: darwin
        formats: [none]
    files:
      - src: '{{ dir (dir (dir .ArtifactPath)) }}/driga-app_windows_{{ .Arch }}_*/Driga.exe'
        dst: .
        strip_parent: true
      - README.md
      - LICENSE
      - NOTICE
      - src: internal/web/static/vendor/LICENSES.txt
        dst: third-party/vendor-LICENSES.txt
      - src: internal/web/static/fonts/LICENSE.txt
        dst: third-party/fonts-LICENSE.txt

  - id: driga-macos
    ids:
      - driga
    name_template: "driga_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: windows
        formats: [none]
    # Preserve the binary's bundle path. The hook stages all other app files
    # separately so the archive includes the executable exactly once.
    strip_binary_directory: false
    files:
      - src: '{{ dir (dir (dir (dir .ArtifactPath))) }}/bundle-resources'
        dst: Driga.app
      - README.md
      - LICENSE
      - NOTICE
      - src: internal/web/static/vendor/LICENSES.txt
        dst: third-party/vendor-LICENSES.txt
      - src: internal/web/static/fonts/LICENSE.txt
        dst: third-party/fonts-LICENSE.txt

nfpms:
  - id: driga
    ids:
      - driga
    package_name: driga
    file_name_template: "driga_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: LabStack
    homepage: https://github.com/labstack/driga
    maintainer: LabStack <support@labstack.com>
    description: "Watch every AI coding agent session on a machine: state, project, branch, memory, an attention inbox, and file conflicts."
    license: Apache-2.0
    bindir: /usr/bin
    formats:
      - deb
      - rpm
    # Best effort on Linux desktops: the CLI works without these, so they are
    # recommended, not required. Package names differ per format.
    overrides:
      deb:
        recommends:
          - libgtk-3-0 | libgtk-3-0t64
          - libwebkit2gtk-4.1-0
          - libayatana-appindicator3-1
      rpm:
        recommends:
          - gtk3
          - webkit2gtk4.1
          - libayatana-appindicator-gtk3
    contents:
      - src: packaging/linux/driga.desktop
        dst: /usr/share/applications/driga.desktop
        file_info:
          mode: 0644
      - src: internal/web/static/brand/icon-512.png
        dst: /usr/share/icons/hicolor/512x512/apps/run.driga.png
        file_info:
          mode: 0644

checksum:
  name_template: "driga_{{ .Version }}_checksums.txt"
  algorithm: sha256

homebrew_casks:
  - name: driga
    skip_upload: false
    ids:
      - driga-macos
    binaries:
      - '#{appdir}/Driga.app/Contents/MacOS/driga'
    # The OSS custom Ruby block uses Homebrew's normal app artifact, which
    # installs Driga.app into /Applications, and avoids the Pro-only GoReleaser
    # `app` (DMG) integration.
    custom_block: |
      app "Driga.app"
    caveats: |
      Driga.app is in /Applications, and driga links to the CLI inside it.
      Open Driga from Finder, Spotlight or with driga app. The app collects in
      the background and starts at login.
    url:
      template: "https://github.com/labstack/driga/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "chore: update driga to {{ .Tag }}"
    directory: Casks
    homepage: https://github.com/labstack/driga
    description: "Watch every AI coding agent session on a machine: state, project, branch, memory, an attention inbox, and file conflicts."
    repository:
      owner: labstack
      name: homebrew-tap
      branch: main
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    commit_author:
      name: driga-release
      email: support@labstack.com

scoops:
  - name: driga
    skip_upload: false
    ids:
      - driga-windows
    url_template: "https://github.com/labstack/driga/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_msg_template: "chore: update driga to {{ .Tag }}"
    homepage: https://github.com/labstack/driga
    description: "Watch every AI coding agent session on a machine: state, project, branch, memory, an attention inbox, and file conflicts."
    license: Apache-2.0
    shortcuts:
      - [Driga.exe, Driga]
    repository:
      owner: labstack
      name: scoop-bucket
      branch: main
      token: "{{ .Env.PACKAGE_REPOS_TOKEN }}"
    commit_author:
      name: driga-release
      email: support@labstack.com

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
