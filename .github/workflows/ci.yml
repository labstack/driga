name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: ""
      GOEXPERIMENT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      # Tests must never see a real home, agent config or Driga data.
      - name: Isolate test and build state
        run: |
          task_root=$(mktemp -d "$RUNNER_TEMP/driga-ci.XXXXXX")
          mkdir -p "$task_root/home" "$task_root/data" "$task_root/spool"
          {
            echo "HOME=$task_root/home"
            echo "CODEX_HOME=$task_root/home/.codex"
            echo "GEMINI_CLI_HOME=$task_root/home/.gemini"
            echo "XDG_CONFIG_HOME=$task_root/home/.config"
            echo "XDG_DATA_HOME=$task_root/home/.local/share"
            echo "XDG_STATE_HOME=$task_root/home/.local/state"
            echo "DRIGA_DATA_DIR=$task_root/data"
            echo "DRIGA_SPOOL_DIR=$task_root/spool"
            echo "DRIGA_CONFIG=$task_root/config.toml"
            echo "GOCACHE=$task_root/gocache"
            echo "GOMODCACHE=$task_root/gomodcache"
          } >> "$GITHUB_ENV"
      - name: Format, vet and generated files
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go generate ./internal/config
          git diff --exit-code -- .env.example
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Test on Linux
        run: go test ./...
      - name: Race test
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Cross-build the cgo-free targets
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/driga
          done

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean --skip=publish,sign,notarize
      - name: Inspect release snapshot
        run: scripts/verify-release-dist.sh dist

  windows:
    name: Windows tests
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: ""
      GOEXPERIMENT: ""
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false
      - name: Isolate test and build state
        run: |
          $taskRoot = Join-Path $env:RUNNER_TEMP ("dw-" + [guid]::NewGuid().ToString('N').Substring(0,8))
          $testHome = Join-Path $taskRoot 'home'
          New-Item -ItemType Directory -Force $testHome, "$taskRoot/data", "$taskRoot/spool", "$taskRoot/temp" | Out-Null
          $settings = @{
            HOME = $testHome
            USERPROFILE = $testHome
            APPDATA = "$testHome/AppData/Roaming"
            LOCALAPPDATA = "$testHome/AppData/Local"
            CLAUDE_CONFIG_DIR = ''
            CODEX_HOME = "$testHome/.codex"
            COPILOT_HOME = "$testHome/.copilot"
            GEMINI_CLI_HOME = "$testHome/.gemini"
            XDG_CONFIG_HOME = "$testHome/.config"
            XDG_DATA_HOME = "$testHome/.local/share"
            XDG_STATE_HOME = "$testHome/.local/state"
            DRIGA_DATA_DIR = "$taskRoot/data"
            DRIGA_SPOOL_DIR = "$taskRoot/spool"
            DRIGA_CONFIG = "$taskRoot/config.toml"
            TEMP = "$taskRoot/temp"
            TMP = "$taskRoot/temp"
            GOCACHE = "$taskRoot/gocache"
            GOMODCACHE = "$taskRoot/gomodcache"
          }
          foreach ($entry in $settings.GetEnumerator()) { "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV }
      - name: Vet
        run: go vet ./...
      - name: Test on Windows
        run: go test ./...
      - name: Build the cgo-free Windows targets
        run: |
          go build ./...
          $env:GOARCH = 'arm64'
          go build ./...
