name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: ""
      GOEXPERIMENT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      # just is installed from its pinned release asset rather than through
      # extractions/setup-just, which resolves the version through the GitHub
      # releases API on every run and fails when that lookup is rate limited.
      # The checksum makes CI run exactly this artifact or stop.
      - name: Install just and tools
        run: |
          version=1.58.0
          archive=just-${version}-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 3 -o "$archive" "https://github.com/casey/just/releases/download/${version}/${archive}"
          echo "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" just
          sudo install -m 0755 just /usr/local/bin/just
          rm -f "$archive" just
          bun=1.4.3
          curl -fsSL --retry 3 -o bun.zip "https://github.com/oven-sh/bun/releases/download/bun-v${bun}/bun-linux-x64.zip"
          echo "3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18  bun.zip" | sha256sum --check --strict -
          unzip -q bun.zip
          sudo install -m 0755 bun-linux-x64/bun /usr/local/bin/bun
          rm -rf bun.zip bun-linux-x64
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          install-only: true
      # Tests run with a disposable home and Driga data (scripts/isolated.sh).
      - name: Verify repository
        run: just ci

  windows:
    name: Windows tests
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: ""
      GOEXPERIMENT: ""
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Isolate test and build state
        run: |
          $goCache, $goModCache = (go env GOCACHE), (go env GOMODCACHE)
          $taskRoot = Join-Path $env:RUNNER_TEMP ("dw-" + [guid]::NewGuid().ToString('N').Substring(0,8))
          $testHome = Join-Path $taskRoot 'home'
          New-Item -ItemType Directory -Force $testHome, "$taskRoot/data", "$taskRoot/spool", "$taskRoot/temp" | Out-Null
          $settings = @{
            HOME = $testHome
            USERPROFILE = $testHome
            APPDATA = "$testHome/AppData/Roaming"
            LOCALAPPDATA = "$testHome/AppData/Local"
            CLAUDE_CONFIG_DIR = ''
            CODEX_HOME = "$testHome/.codex"
            COPILOT_HOME = "$testHome/.copilot"
            GEMINI_CLI_HOME = "$testHome/.gemini"
            XDG_CONFIG_HOME = "$testHome/.config"
            XDG_DATA_HOME = "$testHome/.local/share"
            XDG_STATE_HOME = "$testHome/.local/state"
            DRIGA_DATA_DIR = "$taskRoot/data"
            DRIGA_SPOOL_DIR = "$taskRoot/spool"
            DRIGA_CONFIG = "$taskRoot/config.toml"
            TEMP = "$taskRoot/temp"
            TMP = "$taskRoot/temp"
            GOCACHE = $goCache
            GOMODCACHE = $goModCache
          }
          foreach ($entry in $settings.GetEnumerator()) { "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV }
      - name: Vet
        run: go vet ./...
      - name: Test on Windows
        run: go test ./...
      - name: Build the cgo-free Windows targets
        run: |
          go build ./...
          $env:GOARCH = 'arm64'
          go build ./...

  windows-e2e:
    name: Windows end-to-end
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: ""
      GOEXPERIMENT: ""
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Isolate test and build state
        run: |
          $goCache, $goModCache = (go env GOCACHE), (go env GOMODCACHE)
          $taskRoot = Join-Path $env:RUNNER_TEMP ("dw-" + [guid]::NewGuid().ToString('N').Substring(0,8))
          $testHome = Join-Path $taskRoot 'home'
          New-Item -ItemType Directory -Force $testHome, "$taskRoot/data", "$taskRoot/spool", "$taskRoot/temp" | Out-Null
          $settings = @{
            HOME = $testHome
            USERPROFILE = $testHome
            APPDATA = "$testHome/AppData/Roaming"
            LOCALAPPDATA = "$testHome/AppData/Local"
            CLAUDE_CONFIG_DIR = ''
            CODEX_HOME = "$testHome/.codex"
            COPILOT_HOME = "$testHome/.copilot"
            GEMINI_CLI_HOME = "$testHome/.gemini"
            XDG_CONFIG_HOME = "$testHome/.config"
            XDG_DATA_HOME = "$testHome/.local/share"
            XDG_STATE_HOME = "$testHome/.local/state"
            DRIGA_DATA_DIR = "$taskRoot/data"
            DRIGA_SPOOL_DIR = "$taskRoot/spool"
            DRIGA_CONFIG = "$taskRoot/config.toml"
            TEMP = "$taskRoot/temp"
            TMP = "$taskRoot/temp"
            GOCACHE = $goCache
            GOMODCACHE = $goModCache
          }
          foreach ($entry in $settings.GetEnumerator()) { "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV }
      - name: Windows end-to-end
        run: go test -tags e2e ./internal/e2e -v -timeout 25m
