# First match wins. Keep specific modes before generic interactive entries.
# Command modes use platform argv; regex patterns start at the executable token.

[[signature]]
name = "copilot-headless"
agent = "copilot"
role = "headless"
match = ['^(?:[^[:space:]]*/)?(?:copilot|node[[:space:]]+[^[:space:]]*/@github/copilot/npm-loader\.js)[[:space:]]+(?:[^[:space:]]+[[:space:]]+)*(?:-p|--prompt)([[:space:]]|=|$)']

[[signature]]
name = "copilot-interactive"
agent = "copilot"
role = "interactive"
match = ['^(?:[^[:space:]]*/)?(?:copilot|node[[:space:]]+[^[:space:]]*/@github/copilot/npm-loader\.js)([[:space:]]|$)']

[[signature]]
name = "driga-internal"
agent = "claude"
role = "internal"
match = ['^(?:[^[:space:]]*/)?claude[[:space:]]+(?:[^[:space:]]+[[:space:]]+)*--name[[:space:]]+driga-internal([[:space:]]|$)']

[[signature]]
name = "agy-interactive"
agent = "agy"
role = "interactive"
match = ['^(?:[^[:space:]]*/)?agy([[:space:]]|$)']

[[signature]]
name = "gemini-interactive"
agent = "gemini"
role = "interactive"
match = [
  '^(?:[^[:space:]]*/)?gemini([[:space:]]|$)',
  '^(?:[^[:space:]]*/)?node[[:space:]]+[^[:space:]]*/@google/gemini-cli/[^[:space:]]*/index\.js([[:space:]]|$)',
]

[[signature]]
name = "claude-mcp"
agent = "claude"
role = "helper"
command_modes = [["mcp", "serve"]]

[[signature]]
name = "claude-chrome-native-host"
agent = "claude"
role = "helper"
# Chrome owns this native messaging host, even after browser exit/reparenting.
protect_tree = true
command_modes = [["--chrome-native-host"]]

[[signature]]
name = "claude-daemon"
agent = "claude"
role = "service"
command_modes = [["daemon", "run"]]

[[signature]]
name = "claude-background-helper"
agent = "claude"
role = "helper"
command_modes = [["bg-pty-host"], ["bg-spare"], ["--bg-pty-host"], ["--bg-spare"]]

[[signature]]
name = "claude-headless"
agent = "claude"
role = "headless"
match = ['^(?:[^[:space:]]*/)?claude[[:space:]]+(?:[^[:space:]]+[[:space:]]+)*(?:-p|--print)([[:space:]]|$)']

[[signature]]
name = "codex-exec"
agent = "codex"
role = "headless"
command_modes = [["exec"]]

[[signature]]
name = "codex-sandbox"
agent = "codex"
role = "helper"
command_modes = [["sandbox"]]

[[signature]]
name = "codex-exec-server"
agent = "codex"
role = "helper"
command_modes = [["exec-server"]]

[[signature]]
name = "codex-app-server-daemon"
host_name = "codex app-server"
agent = "codex"
role = "service"
# Only the managed installation is exempt from orphan cleanup.
executable_match = '^.*/\.codex/packages/app-server-daemon/(?:.*/)?codex$'
command_modes = [["app-server"]]

[[signature]]
name = "codex-app-server"
host_name = "codex app-server"
agent = "codex"
role = "host"
# Hosts can become orphans. Rollouts supply their conversations independently.
command_modes = [["app-server"]]

[[signature]]
name = "codex-app-server-broker"
agent = "codex"
role = "helper"
match = [
  '^(?:[^[:space:]]*/)?node[[:space:]]+(?:[^[:space:]]*/)?app-server-broker\.mjs([[:space:]]|$)',
  '^(?:[^[:space:]]*/)?app-server-broker\.mjs([[:space:]]|$)',
]

[[signature]]
name = "desktop-app"
role = "app"
app_bundle = true
match = ['''^["']?(?:/(?:[^/[:space:]"']+/)*|~/)Applications/[^/]+\.app/Contents/MacOS/[^/[:space:]"']+["']?([[:space:]]|$)''']

[[signature]]
name = "generic-mcp-launcher"
role = "helper"
match = [
  '^(?:[^[:space:]]*/)?(?:npx|uvx|bunx)[[:space:]]+(?:[^[:space:]]+[[:space:]]+)*[^[:space:]]*mcp[^[:space:]]*([[:space:]]|$)',
  '^(?:[^[:space:]]*/)?pipx[[:space:]]+run[[:space:]]+(?:[^[:space:]]+[[:space:]]+)*[^[:space:]]*mcp[^[:space:]]*([[:space:]]|$)',
]

[[signature]]
name = "claude-interactive"
agent = "claude"
role = "interactive"
match = ['^(?:[^[:space:]]*/)?claude([[:space:]]|$)']

[[signature]]
name = "codex-interactive"
agent = "codex"
role = "interactive"
match = ['^(?:[^[:space:]]*/)?codex([[:space:]]|$)']

# Read-only Machine reports; these never confer orphan/cleanup eligibility.
[[mcp_server]]
name = "maestro mcp"
match = ['^(?:[^[:space:]]*/)?java[[:space:]]+.*maestro\.cli\.AppKt[[:space:]]+mcp([[:space:]]|$)']

[[mcp_server]]
name = "codegraph mcp"
match = ['^(?:[^[:space:]]*/)?node[[:space:]]+[^[:space:]]*/(?:@[^/[:space:]]*/)?codegraph/(?:[^[:space:]]*/)*(?:index|server|mcp)\.[cm]?js([[:space:]]|$)']
